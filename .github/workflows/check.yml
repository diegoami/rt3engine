name: check

# Generated by the harness scaffold (unit gate: CLAUDE.md project slot) and
# adapted for the Rust workspace: fmt + clippy + make test.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: make fmt
      - name: Clippy
        run: make clippy
      - name: Test
        run: make test
