name: check

# Generated by the harness scaffold. One job, running the project's declared
# test command (CLAUDE.md, project slot). Pin a runtime here if the project
# needs one.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: make test
